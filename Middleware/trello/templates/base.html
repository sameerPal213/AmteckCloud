{% load static %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- amteck.com stylesheet install -->
		<link rel="stylesheet" 
			  id="astra-google-fonts-css" 
			  href="https://fonts.googleapis.com/css?family=Open+Sans%3A400%2C%7CJosefin+Sans%3A400%2C%7CRoboto%3A500&amp;display=fallback&amp;ver=4.1.5" 
			  media="all">
		<link rel="stylesheet" href="{% static 'style.css' %}" type="text/css">
		{% block head %}
		{% endblock %}
	</head>

	<body>
		<div id="main-header">
			<img width="184" height="54" 
				src="https://www.amteck.com/wp-content/uploads/2022/02/logo.png" 
				class="custom-logo" alt="Amteck" decoding="async">
		</div>
		<div class="banner">
			<img src="https://www.amteck.com/wp-content/uploads/2022/03/page-header.jpg">
			<div class="text-container">
				<div class="title">
					{% block title %}
					{% endblock %}
				</div>
				<div class="navigation">
					{% block navigation %} {%endblock%}
				</div>
			</div>
		</div>
		<div id="content">
			{% block content %}
			{% endblock %}
		</div>
	</body>
</html>
