<!-- template/registration/login.html -->
{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <div>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="input__floating_placeholder_group">
                    <input
                    {% if field.html_name == "password" %}
                           type="password"
                    {% else %}
                           type="text"
                    {% endif %}
                           name="{{ field.html_name }}"
                           id="{{ field.id_for_label }}"
                           class="input__floating_placeholder_field"
                           placeholder="{{ field.html_name }}"
                    />
                    <label
                           for="{{ field.id_for_label }}"
                           class="input__floating_placeholder_label" >
                        {% if field.html_name == "password" %}
                              Password 
                        {% else %}
                              Email
                        {% endif %}
                    </label>
                    {{ field.errors }}
                </div>
            {% endfor %}
            
            <button type="submit">Login</button>
        </form>
    </div>
{% endblock %}
